site_name: Tippler's Log
site_url: "https://yhf216.github.io"
theme:
  name: material
  language: zh

  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换至深色模式

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式

nav:
  - 主页:
      - index.md
  - 观点与反思:
      - 零碎的观点: opinions/零碎的观点.md
  - 随笔:
      - 20260223: writings/20260223.md
      - 20260216: writings/20260216.md

